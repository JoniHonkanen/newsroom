name: Deploy to Production

on:
  push:
    branches: 
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'JoniHonkanen/newsroom'
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          echo "🚀 Starting deployment..."
          
          cd ${{ secrets.PROJECT_PATH || '/opt/newsroom' }}
          
          echo "📥 Pulling latest code..."
          git fetch origin
          
          # Tarkista muuttuiko docker-compose.yml
          NEEDS_BUILD=false
          if git diff HEAD origin/main --name-only | grep -q "docker-compose.yml"; then
            echo "🏗️ docker-compose.yml changed - will rebuild"
            NEEDS_BUILD=true
          else
            echo "⏩ docker-compose.yml unchanged - skipping build"
          fi
          
          git reset --hard origin/main
          
          if [ ! -f .env ]; then
            echo "❌ ERROR: .env file missing!"
            exit 1
          fi
          
          echo "🛑 Stopping old containers..."
          docker compose down
          
          if [ "$NEEDS_BUILD" = true ]; then
            echo "🏗️ Building images..."
            docker compose build --no-cache
          fi
          
          echo "▶️ Starting containers..."
          docker compose up -d
          
          echo "⏳ Waiting for services..."
          sleep 20
          
          echo "🔍 Checking service health..."
          docker compose ps
          
          if curl -k -f https://localhost/health >/dev/null 2>&1; then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Warning: Backend health check failed"
          fi
          
          echo "📋 Recent logs:"
          docker compose logs --tail=20
          
          echo "✅ Deployment complete!"

    - name: Notify on Success
      if: success()
      run: echo "✅ Deployment successful at $(date)"
        
    - name: Notify on Failure
      if: failure()
      run: echo "❌ Deployment failed - check logs"